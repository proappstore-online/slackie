name: Deploy to R2

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: proappstore-online/platform/.github/workflows/app-deploy.yml@app-deploy-v1
    with:
      e2e: web
    secrets: inherit
