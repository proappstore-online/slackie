<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <meta name="description" content="slackie — your team’s records, approvals and audit trail in one workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="slackie" />
    <meta property="og:description" content="slackie" />
    <meta property="og:url" content="https://slackie.proappstore.online/" />
    <meta property="og:image" content="https://slackie.proappstore.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="slackie" />
    <meta name="twitter:description" content="slackie" />
    <meta name="twitter:image" content="https://slackie.proappstore.online/og-image.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('stores-theme');
          if (stored === 'light' || stored === 'dark') pref = stored;
          var text = localStorage.getItem('stores-text-size');
          if (text === 'lg' || text === 'sm') document.documentElement.dataset.text = text;
        } catch (_) { /* Storage restrictions must not prevent system preferences. */ }
        var scheme = matchMedia('(prefers-color-scheme: dark)');
        function applyTheme() {
          var dark = pref === 'dark' || (pref === 'system' && scheme.matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.getElementById('theme-color').content = dark ? '#000000' : '#ffffff';
        }
        applyTheme();
        scheme.addEventListener('change', applyTheme);
        addEventListener('storage', function(event) {
          if (event.key === 'stores-theme' || event.key === null) {
            pref = event.newValue === 'light' || event.newValue === 'dark' ? event.newValue : 'system';
            applyTheme();
          }
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Slackie</title>
    <script src="https://api.proappstore.online/v1/analytics.js?app=slackie" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
